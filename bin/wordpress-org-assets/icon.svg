<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- アプリのアイコンの地。差し色（yuiami.jpの#0094bc）を下に、同じ青を明るくしたものを上に置く -->
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33b8d9"/>
      <stop offset="1" stop-color="#0094bc"/>
    </linearGradient>
    <!-- ガラスの縁（上を明るく）と、左上から当たる光 -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".15" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 地（作者のほかのプラグインのアイコンと同じ色） -->
  <rect width="256" height="256" fill="#f4f4f5"/>
  <!-- 横長のリンクカード。枠線は引かず、白い面だけで形を作る -->
  <rect x="24" y="72" width="208" height="112" rx="22" fill="#fff"/>
  <!-- 左にアプリのアイコン。iOSのガラス風に、角丸の正方形へ光と縁を重ねる -->
  <rect x="42" y="90" width="76" height="76" rx="18" fill="url(#app)"/>
  <rect x="42" y="90" width="76" height="76" rx="18" fill="url(#sheen)"/>
  <rect x="43" y="91" width="74" height="74" rx="17" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- 半透明の白い三角を2枚、上向きと下向きで斜めに少しずらして重ねる（同心にすると六芒星になるため）。
       重なった所が明るくなる。透明度はグループに掛け、塗りと縁取りの重なりで濃くならないようにする -->
  <g opacity=".6"><path d="M77.5 108.2L92.5 134.2L62.5 134.2Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></g>
  <g opacity=".6"><path d="M82.5 147.8L97.5 121.8L67.5 121.8Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></g>
  <!-- 右にタイトルと説明文の線 -->
  <rect x="134" y="104" width="76" height="14" rx="7" fill="#52525b"/>
  <rect x="134" y="132" width="48" height="12" rx="6" fill="#d4d4d8"/>
</svg>
