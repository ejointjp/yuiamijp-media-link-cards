<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- アプリのアイコンの地。差し色（yuiami.jpの#0094bc）を下に、同じ青を明るくしたものを上に置く -->
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33b8d9"/>
      <stop offset="1" stop-color="#0094bc"/>
    </linearGradient>
  </defs>
  <!-- 地（作者のほかのプラグインのアイコンと同じ色） -->
  <rect width="256" height="256" fill="#f4f4f5"/>
  <!-- 横長のリンクカード。枠線は引かず、白い面だけで形を作る -->
  <rect x="24" y="72" width="208" height="112" rx="22" fill="#fff"/>
  <!-- 左にアプリのアイコン（角丸の正方形に、白い上向きの三角。同じ色の太い線で縁取って角を丸める） -->
  <rect x="42" y="90" width="76" height="76" rx="18" fill="url(#app)"/>
  <path d="M80 114L92 135L68 135Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  <!-- 右にタイトルと説明文の線 -->
  <rect x="134" y="104" width="76" height="14" rx="7" fill="#52525b"/>
  <rect x="134" y="132" width="48" height="12" rx="6" fill="#d4d4d8"/>
</svg>
