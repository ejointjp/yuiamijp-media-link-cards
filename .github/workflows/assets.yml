name: Update WordPress.org assets

# .wordpress-org/のアイコン・バナー・スクリーンショットだけを、リリースせずにwordpress.orgの
# SVNのassets/へ反映する。手動で実行する（GitHubのActionsの画面か、gh workflow run assets.yml）。
#
# 10upのactionはreadme.txtもtrunkと公開中のタグへ反映するので、公開前のChangelogなどが
# 出てしまわないよう、readme.txtを最後に公開したタグのものに戻してから渡す。
# IGNORE_OTHER_FILESで、assetsとreadme.txt以外（ビルド前のコードなど）は送らない。
on:
  workflow_dispatch:

jobs:
  assets:
    name: Update assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 最後に公開したタグを探すため、タグを含めて全部取る
          fetch-depth: 0

      - name: Restore readme.txt from the last release
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          echo "readme.txt: ${tag}"
          git checkout "$tag" -- readme.txt

      - name: WordPress.org plugin asset update
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          IGNORE_OTHER_FILES: true
          SLUG: yuiamijp-media-link-cards
